<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-labelledby="title">
<title id="title">Champ de vision : Investigate, Chase et Attack</title>
<style>
  :root {
    color-scheme: light dark;
    --background: #ffffff;
    --border: #cbd5e1;
    --text: #1e293b;
    --muted: #475569;
    --investigate: #2563eb;
    --chase: #b45309;
    --attack: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #151b23;
      --border: #354454;
      --text: #e6edf3;
      --muted: #9ba9ba;
      --investigate: #75a7db;
      --chase: #e7a242;
      --attack: #e16b70;
    }
  }
</style>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9ba9ba" style="fill:var(--muted)"/></marker></defs>
<rect x="1" y="1" width="678" height="468" rx="12" fill="#151b23" stroke="#354454" style="fill:var(--background);stroke:var(--border)"/>
<g font-family="system-ui, sans-serif" fill="#e6edf3" style="fill:var(--text)"><text x="24" y="35" font-size="20" fill="#e6edf3" text-anchor="start" font-weight="650" style="fill:var(--text)">Champ de vision du monstre</text><path d="M340 390 L129.22 155.91 A315 315 0 0 1 550.78 155.91 Z" fill="#75a7db" fill-opacity=".20" stroke="#75a7db" stroke-width="2" style="fill:var(--investigate);stroke:var(--investigate)"/><path d="M340 390 L200.82 235.43 A208 208 0 0 1 479.18 235.43 Z" fill="#e7a242" fill-opacity=".20" stroke="#e7a242" stroke-width="2" style="fill:var(--chase);stroke:var(--chase)"/><path d="M340 390 L279.11 322.37 A91 91 0 0 1 400.89 322.37 Z" fill="#e16b70" fill-opacity=".20" stroke="#e16b70" stroke-width="2" style="fill:var(--attack);stroke:var(--attack)"/><line x1="340" y1="390" x2="340" y2="75" stroke="#9ba9ba" stroke-dasharray="6 6" opacity=".7" style="stroke:var(--muted)"/><text x="340" y="135" font-size="22" fill="#e6edf3" text-anchor="middle" font-weight="650" style="fill:var(--text)">Investigate</text><text x="340" y="240" font-size="22" fill="#e6edf3" text-anchor="middle" font-weight="650" style="fill:var(--text)">Chase</text><text x="340" y="335" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="650" style="fill:var(--text)">Attack</text><path d="M313.90 361.02 A39 39 0 0 1 366.10 361.02" fill="none" stroke="#e6edf3" stroke-width="2" style="stroke:var(--text)"/><line x1="371" y1="360" x2="426" y2="360" stroke="#9ba9ba" style="stroke:var(--muted)"/><text x="437" y="366" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="400" style="fill:var(--text)">FOV</text><circle cx="340" cy="390" r="12" fill="#e6edf3" style="fill:var(--text)"/><text x="340" y="420" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="400" style="fill:var(--text)">Monstre</text><text x="340" y="449" font-size="12" fill="#9ba9ba" text-anchor="middle" font-weight="400" style="fill:var(--muted)">Distances relatives • angle et seuils à régler pendant les tests.</text></g></svg>