<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 390" width="740" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Estimation d'une destination — vue du dessus</title>
  <desc id="desc">Le monstre perçoit une direction. Trois points sont testés sur cette direction. P1 est valide, P2 est dans une table et rejeté, P3 est retenu. Le chemin contourne la table.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --navmesh: #e2e8f0;
      --obstacle: #cbd5e1;
      --border: #94a3b8;
      --obstacle-border: #64748b;
      --text: #1e293b;
      --muted: #475569;
      --direction: #2563eb;
      --route: #047857;
      --candidate: #a16207;
      --invalid: #dc2626;
      --invalid-bg: #fee2e2;
      --selected-bg: #d1fae5;
      --monster-arrow: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f172a;
        --navmesh: #1e293b;
        --obstacle: #334155;
        --border: #475569;
        --obstacle-border: #94a3b8;
        --text: #e2e8f0;
        --muted: #cbd5e1;
        --direction: #60a5fa;
        --route: #34d399;
        --candidate: #f59e0b;
        --invalid: #ef4444;
        --invalid-bg: #40252e;
        --selected-bg: #153c35;
        --monster-arrow: #334155;
      }
    }
  </style>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#60a5fa" style="fill:var(--direction)"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#34d399" style="fill:var(--route)"/></marker>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#334155" style="fill:var(--obstacle)"/><path d="M0 0V9" stroke="#475569" stroke-width="2" style="stroke:var(--border)"/></pattern>
  </defs>
  <rect width="740" height="390" rx="14" fill="#0f172a" style="fill:var(--background)"/>
  <g font-family="system-ui, sans-serif" fill="#e2e8f0" style="fill:var(--text)">
    <text x="28" y="32" font-size="18" font-weight="650">Estimation d'une destination</text>
    <text x="712" y="32" text-anchor="end" font-size="12" fill="#cbd5e1" style="fill:var(--muted)">Vue du dessus</text>
    <rect x="28" y="50" width="684" height="263" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.4" style="fill:var(--navmesh);stroke:var(--border)"/>
    <text x="43" y="73" font-size="12" fill="#cbd5e1" style="fill:var(--muted)">NavMesh · zone accessible</text>
    <!-- obstacle and clearance -->
    <rect x="307" y="105" width="136" height="123" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-dasharray="5 4" style="fill:var(--background);stroke:var(--obstacle-border)"/>
    <rect x="320" y="118" width="110" height="97" rx="3" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1.5" style="stroke:var(--obstacle-border)"/>
    <text x="375" y="140" font-size="13" text-anchor="middle" font-weight="600">Table</text>
    <!-- direction ray -->
    <path d="M100 170H668" fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#blue)" style="stroke:var(--direction)"/>
    <text x="196" y="127" text-anchor="middle" font-size="13" fill="#60a5fa" style="fill:var(--direction)">Direction perçue</text>
    <path d="M196 134V157" stroke="#60a5fa" stroke-width="1.2" style="stroke:var(--direction)"/>
    <!-- chosen path -->
    <path d="M100 170L255 259H457L564 181" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)" style="stroke:var(--route)"/>
    <text x="355" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399" style="fill:var(--route)">Chemin A* : contourner la table</text>
    <!-- origin -->
    <circle cx="100" cy="170" r="17" fill="#e2e8f0" stroke="#0f172a" stroke-width="3" style="fill:var(--text);stroke:var(--background)"/>
    <path d="M94 162L109 170L94 178Z" fill="#334155" style="fill:var(--monster-arrow)"/>
    <text x="100" y="207" font-size="13" text-anchor="middle" font-weight="600">Monstre (O)</text>
    <!-- candidates -->
    <circle cx="230" cy="170" r="8" fill="#f59e0b" stroke="#0f172a" stroke-width="2" style="fill:var(--candidate);stroke:var(--background)"/>
    <text x="230" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#f59e0b" style="fill:var(--candidate)">P1</text>
    <text x="230" y="209" text-anchor="middle" font-size="11" fill="#f59e0b" style="fill:var(--candidate)">Valide</text>
    <circle cx="375" cy="170" r="11" fill="#40252e" stroke="#ef4444" stroke-width="1.6" style="fill:var(--invalid-bg);stroke:var(--invalid)"/>
    <path d="M370 165L380 175M380 165L370 175" stroke="#ef4444" stroke-width="2.8" stroke-linecap="round" style="stroke:var(--invalid)"/>
    <text x="375" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#ef4444" style="fill:var(--invalid)">P2 rejeté</text>
    <circle cx="576" cy="170" r="13" fill="#153c35" stroke="#34d399" stroke-width="2.5" style="fill:var(--selected-bg);stroke:var(--route)"/>
    <path d="M570 170l4 4 8-9" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--route)"/>
    <text x="576" y="148" text-anchor="middle" font-size="13" font-weight="650" fill="#34d399" style="fill:var(--route)">P3 retenu</text>
    <text x="620" y="202" text-anchor="middle" font-size="11" fill="#cbd5e1" style="fill:var(--muted)">Destination estimée</text>
    <text x="28" y="343" font-size="14" font-weight="600">Direction connue, distance inconnue.</text>
    <text x="28" y="365" font-size="12" fill="#cbd5e1" style="fill:var(--muted)">P3 est un exemple de choix valide, pas la position réelle de la source.</text>
  </g>
</svg>
