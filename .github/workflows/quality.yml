name: Code Quality

on:
  push:
  pull_request:

jobs:
  format:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: cmake -DTASK=setup -P cmake/Tasks.cmake

      - name: Check formatting
        run: cmake -DTASK=check-format -P cmake/Tasks.cmake

